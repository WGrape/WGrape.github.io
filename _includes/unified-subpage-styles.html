<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap');

:root {
    --wg-ink: #f5f1e9;
    --wg-panel: rgba(255, 255, 255, 0.08);
    --wg-line: rgba(255, 255, 255, 0.2);
    --wg-accent: #fb923c;
    --wg-accent-2: #38bdf8;
    --wg-paper: #101820;
    --wg-text: #e7edf6;
    --wg-muted: #aab8cb;
}

body {
    background:
        radial-gradient(1200px 620px at 90% -10%, rgba(251, 146, 60, 0.2), transparent 55%),
        radial-gradient(900px 520px at 0% 10%, rgba(56, 189, 248, 0.18), transparent 55%),
        linear-gradient(170deg, #111315 0%, #1f2937 50%, #101820 100%);
    color: #e7edf6;
}


/* 文章页 body 和 html 全铺背景 - 使用固定定位伪元素实现 */
.post-page,
.post-page body,
.post-page html {
    color: #e7edf6;
    position: relative;
}

.post-page body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    pointer-events: none;
}

/* 文章头部区域 */
.post-page header.intro-header {
    position: relative;
    overflow: hidden;
    padding-top: 100px;
    padding-bottom: 20px;
    margin-bottom: 0;
    background:
        radial-gradient(1200px 620px at 90% -10%, rgba(251, 146, 60, 0.2), transparent 55%),
        radial-gradient(900px 520px at 0% 10%, rgba(56, 189, 248, 0.18), transparent 55%),
        linear-gradient(170deg, #111315 0%, #1f2937 50%, #101820 100%);
}

.post-page header.intro-header:before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.45;
}

.post-page header.intro-header .container {
    position: relative;
    z-index: 1;
}

.post-page .post-heading h1 {
    font-family: "DM Serif Display", serif;

    color: #f5f1e9 !important;

}

}

.post-page .post-heading .meta {

}

.hero-section {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 20px 60px;
    margin: -80px -30px 40px;
    position: relative;
    overflow: hidden;
    border-radius: 0 0 24px 24px;
}

.hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
}

.hero-orbit {
    position: absolute;
    border-radius: 50%;
    /* border: 1px solid rgba(255, 255, 255, 0.08); */
    border: 1px solid rgb(117 160 186 / 50%);
    width: 100px;
    height: 100px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
}

.hero-orbit:nth-child(1) {
    animation: ripple 3s ease-out infinite;
}

.hero-orbit:nth-child(2) {
    animation: ripple 3s ease-out infinite 0.5s;
}

.hero-orbit:nth-child(3) {
    animation: ripple 3s ease-out infinite 1s;
}

.hero-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
    top: 30%;
    left: 20%;
    animation: float 8s ease-in-out infinite;
}

.hero-glow:nth-child(5) {
    background: radial-gradient(circle, rgba(251, 146, 60, 0.12) 0%, transparent 70%);
    top: 60%;
    left: 70%;
    animation-duration: 10s;
    animation-delay: -3s;
}

.hero-content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 800px;
}

.hero-avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin-bottom: 24px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
    animation: fadeInUp 0.8s ease;
}

.hero-title {
    font-family: "DM Serif Display", serif;
    font-size: 72px;
    line-height: 1.02;
    margin: 0 0 16px;
    letter-spacing: 0.6px;
    animation: fadeInUp 0.8s ease;
    background: linear-gradient(135deg, #f5f1e9 0%, #fb923c 50%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero-subtitle {
    font-family: "Space Grotesk", sans-serif;
    font-size: 24px;
    opacity: 0.9;
    margin-bottom: 28px;
    animation: fadeInUp 0.8s ease 0.2s both;
    color: #f5f1e9;
}

.hero-desc {
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 32px;
    color: #f5f1e9;
    animation: fadeInUp 0.8s ease 0.4s both;
}

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    animation: fadeInUp 0.8s ease 0.6s both;
}

.btn-pill {
    font-family: "Space Grotesk", sans-serif;
    display: inline-block;
    padding: 12px 24px;
    border-radius: 999px;
    text-decoration: none;
    color: #101820;
    background: #f5f1e9;
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
}

.btn-pill:hover {
    transform: translateY(-3px);
    background: #ffffff;
    color: #101820;
    box-shadow: 0 8px 28px rgba(245, 241, 233, 0.35);
    text-decoration: none;
}

.btn-ghost {
    background: transparent;
    color: #f5f1e9;
    border: 1.5px solid rgba(245, 241, 233, 0.35);
}

.btn-ghost:hover {
    background: rgba(245, 241, 233, 0.1);
    border-color: rgba(245, 241, 233, 0.75);
    color: #f5f1e9;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    text-decoration: none;
}

.stats {
    margin-top: 28px;
    display: flex;
    gap: 24px;
    font-family: "Space Grotesk", sans-serif;
    justify-content: center;
    animation: fadeInUp 0.8s ease 0.8s both;
}

.stats b {
    display: block;
    font-size: 20px;
    color: #f5f1e9;
}

.stats span {
    text-align: center;
    color: rgba(245, 241, 233, 0.8);
}

.content-section {
    padding: 40px 0;
}

.content-card {
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 36px;
    margin-bottom: 24px;
}

.section-title {
    font-family: "DM Serif Display", serif;
    font-size: 36px;
    color: #f5f1e9 !important;
    margin-bottom: 28px;
    text-align: center;
}

.about-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
}

.about-item {

    /* padding: 20px; */
}

.about-icon {

}

    color: #f5f1e9 !important;
    margin-bottom: 8px;
}

.about-item-desc {
    font-family: "Space Grotesk", sans-serif;
    font-size: 15px;
    color: var(--wg-muted) !important;
    line-height: 1.6;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-20px) translateX(15px); }
}

@keyframes ripple {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.8;
    }
    100% {
        transform: translate(-50%, -50%) scale(6);
        opacity: 0;
    }
}

@media (max-width: 991px) {
    .site-heading h1,
    .post-heading h1,
    .subpage-heading h1 {

    .subpage-shell {
        margin-top: 0;

    .subpage-card {

}

    .hero-section {
