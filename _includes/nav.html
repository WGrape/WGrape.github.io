<!-- Navigation -->
<style>
body.is-home .navbar.navbar-custom {
    display: none;
}

.navbar.navbar-custom {
    background: rgba(14, 22, 36, 0.68);
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
}

.navbar-custom .navbar-brand {
    color: #f6f1e8;
    font-weight: 700;
    letter-spacing: 0.2px;
}

.navbar-custom .navbar-brand:hover,
.navbar-custom .navbar-brand:focus {
    color: #ffffff;
}

.navbar-custom .nav li a.urlChangeNav {
    color: rgba(237, 242, 252, 0.92);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 12px;
}

.navbar-custom .nav li a.urlChangeNav:hover,
.navbar-custom .nav li a.urlChangeNav:focus {
    color: #ffffff;
    opacity: 1;
}

@media (max-width: 767px) {
    .navbar-custom .nav li a.urlChangeNav {
        font-size: 13px;
        letter-spacing: 0.02em;
    }
}
</style>
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a class="urlChangeNav" href="{{ site.baseurl }}/">主页</a>
                    </li>
                    
                    <li>
                        <a class="urlChangeNav" href="{{ site.baseurl }}/english-visuals/">英文学习</a>
                    </li>

                    <li>
                        <a class="urlChangeNav" href="https://wgrape.github.io/visuals/">可视化学习</a>
                    </li>

                    <li>
                        <a class="urlChangeNav" href="{{ site.baseurl }}/blog/">博客</a>
                    </li>
                    <li>
                        <a class="urlChangeNav" href="{{ site.baseurl }}/pages/my-projects.html">开源项目</a>
                    </li>
                    <li>
                        <a class="urlChangeNav" href="{{ site.baseurl }}/blog/tags/">标签</a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container -->
</nav>
<script>
    var $body = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            $navbar.className = " ";
            setTimeout(function(){
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    };

    $toggle.addEventListener('click', function(e){
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        } else {
            __HuxNav__.open()
        }
    });

    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    });
</script>
