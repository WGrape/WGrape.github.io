    </a>
    <button id="wg-scroll-bottom" class="wg-float-btn" title="滚动到底部" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
</div>
<style>
#wg-float-panel {
    position: fixed;
    right: 20px;
    bottom: 36px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.wg-float-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(10, 20, 32, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(170, 200, 230, 0.88);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 11px;
    font-family: "Space Grotesk", sans-serif;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.18s, color 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.wg-float-btn:hover {
    background: rgba(56, 189, 248, 0.18);
    border-color: rgba(56, 189, 248, 0.45);
    color: #38bdf8;
    transform: scale(1.08);
}
.wg-float-gh {
    width: 48px;
    height: 48px;
    background: rgba(10, 20, 32, 0.9);
    border-color: rgba(56, 189, 248, 0.22);
    font-weight: 600;
    letter-spacing: 0.02em;
    flex-direction: column;
    gap: 2px;
}
.wg-float-gh:hover {
    background: rgba(56, 189, 248, 0.22);
}
@media (max-width: 600px) {
    #wg-float-panel { right: 12px; bottom: 24px; }
}
</style>
